<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luz Ambiente Inteligente</title>
<style>
  :root {
    --fundo: #14121a;
    --painel: #1e1b26;
    --linha: #332e40;
    --texto: #ece8f3;
    --apagado: #7d7590;
    --ok: #63d19e;
    --off: #6b6478;
    --inerte: #4a4458;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--apagado); margin: 0 0 28px; font-size: .95rem; }

  .lampada {
    display: flex; align-items: center; gap: 24px;
    background: var(--painel); border: 1px solid var(--linha);
    border-radius: 16px; padding: 24px; margin-bottom: 20px;
  }
  .bulbo {
    width: 96px; height: 96px; border-radius: 50%; flex: none;
    background: #000; transition: background .4s, box-shadow .4s;
  }
  .bulbo.respiracao { animation: resp 3.2s ease-in-out infinite; }
  .bulbo.pulso { animation: puls .5s ease-in-out infinite; }
  @keyframes resp { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
  @keyframes puls { 0%,100% { transform: scale(.92) } 50% { transform: scale(1.06) } }
  @media (prefers-reduced-motion: reduce) {
    .bulbo.respiracao, .bulbo.pulso { animation: none; }
  }
  .cena { font-size: 1.5rem; font-weight: 600; text-transform: capitalize; }
  .detalhe { color: var(--apagado); font-size: .9rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; padding: 16px; position: relative; }
  .card.inerte { opacity: .55; }
  .selo-inerte {
    position: absolute; top: 12px; right: 12px; font-size: .68rem;
    color: var(--apagado); border: 1px solid var(--linha); border-radius: 999px;
    padding: 2px 8px;
  }
  .rotulo { color: var(--apagado); font-size: .82rem; margin-bottom: 6px; }
  .valor { font-size: 1.5rem; font-weight: 600; }
  .barra { height: 6px; background: #2a2533; border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .barra span { display: block; height: 100%; background: var(--ok); transition: width .3s; }
  .barra.inerte span { background: var(--inerte); }
  .ponto { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--off); margin-right: 7px; }
  .ponto.on { background: var(--ok); }

  fieldset { background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; padding: 18px; }
  legend { padding: 0 8px; color: var(--apagado); font-size: .85rem; }
  .controles { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  label { font-size: .9rem; display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 160px; }
  select, button {
    font: inherit; padding: 9px 16px; border-radius: 8px;
    border: 1px solid var(--linha); background: #2a2533; color: var(--texto); cursor: pointer;
  }
  button:hover { border-color: var(--ok); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  .modo { font-size: .9rem; color: var(--apagado); margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Luz Ambiente Inteligente</h1>
  <p class="sub">Iluminação por luminosidade — som e ocupação chegam com o microfone e o PIR</p>

  <div class="lampada">
    <div class="bulbo" id="bulbo"></div>
    <div>
      <div class="cena" id="cena">—</div>
      <div class="detalhe" id="detalhe">aguardando primeira leitura</div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="rotulo">Luminosidade</div>
      <div class="valor" id="luz">—</div>
      <div class="barra"><span id="barraLuz" style="width:0%"></span></div>
      <div class="detalhe" id="escuro">—</div>
    </div>
    <div class="card" id="cardSom">
      <div class="rotulo">Nível de som</div>
      <div class="valor" id="som">—</div>
      <div class="barra" id="barraSomWrap"><span id="barraSom" style="width:0%"></span></div>
      <div class="detalhe" id="faixa">faixa: —</div>
    </div>
    <div class="card" id="cardOcupacao">
      <div class="rotulo">Ocupação</div>
      <div class="valor" id="ocupado">—</div>
      <div class="detalhe" id="movimento">último movimento: —</div>
    </div>
    <div class="card">
      <div class="rotulo">Dispositivos</div>
      <div><span class="ponto" id="pSensor"></span>sensor</div>
      <div><span class="ponto" id="pAtuador"></span>atuador</div>
    </div>
  </div>

  <fieldset>
    <legend>Controle manual</legend>
    <div class="controles">
      <label>Cor <input type="color" id="cor" value="#ffaa50"></label>
      <label>Brilho <input type="range" id="brilho" min="0" max="255" value="120"></label>
      <label>Efeito
        <select id="animacao">
          <option value="estatica">estática</option>
          <option value="respiracao">respiração</option>
          <option value="pulso">pulso</option>
          <option value="off">apagada</option>
        </select>
      </label>
      <button id="aplicar">Aplicar agora</button>
      <button id="auto">Voltar ao automático</button>
    </div>
    <div class="modo">Modo atual: <strong id="modo">—</strong></div>
  </fieldset>
</div>

<script>
const $ = id => document.getElementById(id);
const hex = ({r,g,b}) => '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
let selosAplicados = false;

function render(s) {
  const cor = hex(s.cor);
  const aceso = s.brilho > 0 && s.animacao !== 'off';
  const bulbo = $('bulbo');
  bulbo.style.background = aceso ? cor : '#000';
  bulbo.style.boxShadow = aceso ? `0 0 ${16 + s.brilho / 4}px ${cor}` : 'none';
  bulbo.className = 'bulbo' + (aceso ? ' ' + s.animacao : '');

  $('cena').textContent = s.cena;
  $('detalhe').textContent = `brilho ${s.brilho}/255 · efeito ${s.animacao}`;

  $('luz').textContent = s.luz === null ? '—' : s.luz.toFixed(1) + '%';
  $('barraLuz').style.width = (s.luz ?? 0) + '%';
  $('escuro').textContent = s.luz === null ? 'aguardando o LDR' : (s.escuro ? 'ambiente escuro' : 'ambiente claro');

  $('som').textContent = s.som === null ? '—' : s.som.toFixed(1) + '%';
  $('barraSom').style.width = (s.som ?? 0) + '%';
  $('faixa').textContent = 'faixa: ' + s.faixa_som;

  $('ocupado').textContent = s.ocupado ? 'ocupado' : 'vazio';
  $('movimento').textContent = s.ultimo_movimento
    ? 'último movimento: ' + new Date(s.ultimo_movimento).toLocaleTimeString('pt-BR')
    : 'último movimento: —';

  $('pSensor').className = 'ponto' + (s.sensor_online ? ' on' : '');
  $('pAtuador').className = 'ponto' + (s.atuador_online ? ' on' : '');
  $('modo').textContent = s.modo;

  // Os selos "sensor ainda não montado" só precisam ser desenhados uma vez;
  // os campos `recursos` não mudam em tempo real.
  if (!selosAplicados && s.recursos) {
    if (!s.recursos.som_habilitado) {
      $('cardSom').classList.add('inerte');
      $('barraSomWrap').classList.add('inerte');
      const selo = document.createElement('span');
      selo.className = 'selo-inerte';
      selo.textContent = 'microfone pendente';
      $('cardSom').appendChild(selo);
    }
    if (!s.recursos.ocupacao_habilitada) {
      $('cardOcupacao').classList.add('inerte');
      const selo = document.createElement('span');
      selo.className = 'selo-inerte';
      selo.textContent = 'PIR pendente';
      $('cardOcupacao').appendChild(selo);
    }
    selosAplicados = true;
  }
}

function conectar() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => setTimeout(conectar, 2000);
}
conectar();

$('aplicar').onclick = async () => {
  const c = $('cor').value;
  await fetch('/api/manual', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      brilho: Number($('brilho').value),
      r: parseInt(c.slice(1,3),16),
      g: parseInt(c.slice(3,5),16),
      b: parseInt(c.slice(5,7),16),
      animacao: $('animacao').value
    })
  });
};

$('auto').onclick = async () => {
  const r = await fetch('/api/automatico', {method: 'POST'});
  if (!r.ok) $('detalhe').textContent = 'sem leitura de luminosidade ainda — ligue o sensor ou o simulador';
};
</script>
</body>
</html>
