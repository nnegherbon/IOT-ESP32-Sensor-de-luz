# Broker MQTT local do projeto (contrato v1.1).
# Autenticação obrigatória: um usuário por dispositivo + o backend. As senhas vêm do .env
# (MQTT_PASS_*) e o arquivo de senhas é gerado na subida do container (ver docker-compose.yml).
# A ACL (acl) garante que cada dispositivo só escreve no próprio ramo e que só o backend comanda.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# Guarda as mensagens retidas (status, estado, config) entre reinícios
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
