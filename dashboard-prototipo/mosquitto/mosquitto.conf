# Broker MQTT local do projeto (rede de laboratório/casa).
# Sem autenticação: os ESP32 se conectam pelo IP do computador que roda o Docker, porta 1883.
# Não exponha esta porta para a internet.
listener 1883 0.0.0.0
allow_anonymous true

# Guarda as mensagens retidas (ex.: status do atuador) entre reinícios
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
