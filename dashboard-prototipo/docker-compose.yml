# Sobe broker MQTT (Mosquitto) + PostgreSQL + backend (assinante MQTT/API/WebSocket) + frontend (nginx).
# Uso: cp .env.example .env (preencha as senhas) && docker compose up -d --build  → http://localhost:${HTTP_PORT}
# Os ESP32 publicam no IP deste computador, porta 1883 (libere a porta no firewall do Windows).
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_PUBLIC_PORT:-1883}:1883"
    env_file: .env
    # Gera o arquivo de senhas a partir do .env (nenhuma senha fica versionada) e sobe o broker
    command: >
      sh -c 'rm -f /mosquitto/data/passwd && touch /mosquitto/data/passwd &&
      mosquitto_passwd -b /mosquitto/data/passwd backend "$$MQTT_PASS_BACKEND" &&
      mosquitto_passwd -b /mosquitto/data/passwd sensor01 "$$MQTT_PASS_SENSOR01" &&
      mosquitto_passwd -b /mosquitto/data/passwd atuador01 "$$MQTT_PASS_ATUADOR01" &&
      chown mosquitto:mosquitto /mosquitto/data/passwd && chmod 0700 /mosquitto/data/passwd &&
      exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf'
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luz}
      POSTGRES_USER: ${POSTGRES_USER:-luz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data      # persistência entre reinícios
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # descomente para acessar o banco do host (psql, backup externo)
    # ports: ["127.0.0.1:5432:5432"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-luz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-luz}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  pgdata:
  mosquitto-data:
